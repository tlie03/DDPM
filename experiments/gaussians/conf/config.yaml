# Gaussians experiment: an unconditional MLP noise estimate learns a mixture of gaussians placed on a ring.
# Tests whether the model covers all modes instead of collapsing onto a few of them.
# Paths are relative to the project root, run the scripts from there:
#   python -m experiments.gaussians.train [overrides, e.g. data.num_modes=16]
#   python -m experiments.gaussians.animate [overrides, e.g. animate.num_samples=500]
#   python -m experiments.gaussians.sample [overrides, e.g. sample.num_samples=1000]

name: gaussians
seed: 0
device: auto  # auto, cpu or cuda
output_dir: experiments/gaussians/output
model_path: ${output_dir}/mlp.pth

data:
  num_samples: 100000
  num_modes: 8
  radius: 4.0  # distance of the mode centers from the origin
  std: 0.2  # standard deviation of every mode
  random_seed: 42

diffusion:
  T: 100
  schedule: cosine  # cosine or linear

model:
  num_layers: 9
  hidden_dim: 64
  time_encoding_channels: 16

train:
  epochs: 300  # 49 batches per epoch -> ~14,700 optimizer steps
  batch_size: 2048
  learning_rate: 0.002

sample:
  num_samples: 4000
  plot_path: ${output_dir}/samples.png

animate:
  num_samples: 1000  # fixed data points that are noised and denoised again
  fps: 12  # one frame per timestep, so this sets the playback speed
  dpi: 100  # resolution of the gif: 5 inch * dpi = 500 x 500 pixels
  colors: 16  # colors per frame, fewer colors give a smaller gif
  forward_gif_path: ${output_dir}/forward.gif
  reverse_gif_path: ${output_dir}/reverse.gif

hydra:
  run:
    dir: ${output_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
